<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SafeCity Diagrama ER Interactivo</title>
    <script src="https://unpkg.com/gojs/release/go.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; overflow: hidden; }
        #myDiagramDiv { width: 100vw; height: 100vh; background-color: #1e1e1e; }
        #header { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #444; }
        h1 { margin: 0 0 10px 0; font-size: 20px; color: #fff; }
        p { margin: 0 0 5px 0; font-size: 13px; color: #ccc; }
        .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; display: block; width: 100%; font-size: 14px; margin-bottom: 5px; }
        button:hover { background: #2ecc71; }
        .btn-alt { background: #3498db; }
        .btn-alt:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div id="header">
        <h1>SafeCity ER Diagram</h1>
        <p>¡Layout ultra expandido activado!</p>
        <div class="legend" style="margin-bottom: 10px;">
            <p><span style="background: #e74c3c;"></span> M1: Crímenes</p>
            <p><span style="background: #9b59b6;"></span> M2: Sospechosos</p>
            <p><span style="background: #3498db;"></span> M3: Recursos Humanos</p>
            <p><span style="background: #f39c12;"></span> M4: Logística</p>
        </div>
        <button onclick="layoutLayered()">Layout Perfecto (Horizontal)</button>
        <button class="btn-alt" onclick="layoutGrid()">Layout en Cuadrícula</button>
        <button class="btn-alt" onclick="layoutForce()">Layout Radial Expandido</button>
    </div>
    <div id="myDiagramDiv"></div>

    <script>
        function init() {
            const $ = go.GraphObject.make;

            const myDiagram = $(go.Diagram, "myDiagramDiv", {
                initialContentAlignment: go.Spot.Center,
                "undoManager.isEnabled": true,
                // POR DEFECTO USAR LAYERED DIGRAPH MUY ESPACIADO PARA QUE NO SE VEA COMO TALLARÍN
                layout: $(go.LayeredDigraphLayout, { 
                    direction: 0, 
                    layerSpacing: 350, // Mucho espacio horizontal
                    columnSpacing: 150, // Mucho espacio vertical
                    setsPortSpots: false
                })
            });

            const itemTempl = $(go.Panel, "Horizontal",
                $(go.Shape,
                    { desiredSize: new go.Size(12, 12), strokeWidth: 0, margin: new go.Margin(0, 5, 0, 0) },
                    new go.Binding("figure", "figure"),
                    new go.Binding("fill", "color")
                ),
                $(go.TextBlock,
                    { stroke: "#e0e0e0", font: "13px sans-serif" },
                    new go.Binding("text", "name"),
                    new go.Binding("font", "iskey", k => k ? "bold 13px sans-serif" : "13px sans-serif")
                )
            );

            myDiagram.nodeTemplate =
                $(go.Node, "Auto",
                    { selectionAdorned: true, resizable: false, layoutConditions: go.Part.LayoutStandard & ~go.Part.LayoutNodeSized, cursor: "pointer" },
                    $(go.Shape, "RoundedRectangle",
                        { fill: "#252526", stroke: "#555", strokeWidth: 2, spot1: go.Spot.TopLeft, spot2: go.Spot.BottomRight }),
                    $(go.Panel, "Table",
                        { margin: 8, stretch: go.GraphObject.Fill },
                        $(go.RowColumnDefinition, { row: 0, sizing: go.RowColumnDefinition.None }),
                        
                        // Header background
                        $(go.Shape, "Rectangle",
                            { row: 0, fill: "gray", stroke: null, stretch: go.GraphObject.Fill },
                            new go.Binding("fill", "color")
                        ),
                        // Header text
                        $(go.TextBlock,
                            { row: 0, margin: new go.Margin(6, 12), stroke: "white", font: "bold 16px sans-serif", alignment: go.Spot.Center },
                            new go.Binding("text", "key")
                        ),
                        
                        // Fields list
                        $(go.Panel, "Vertical",
                            { row: 1, padding: 8, alignment: go.Spot.TopLeft, defaultAlignment: go.Spot.Left, stretch: go.GraphObject.Horizontal, itemTemplate: itemTempl },
                            new go.Binding("itemArray", "items")
                        )
                    )
                );

            myDiagram.linkTemplate =
                $(go.Link,
                    { routing: go.Link.AvoidsNodes, curve: go.Link.JumpOver, corner: 10, toShortLength: 4, relinkableFrom: true, relinkableTo: true },
                    $(go.Shape, { stroke: "#7f8c8d", strokeWidth: 2 }),
                    $(go.Shape, { toArrow: "Standard", stroke: null, fill: "#7f8c8d" }),
                    $(go.TextBlock, { segmentIndex: 0, segmentOffset: new go.Point(NaN, NaN), segmentOrientation: go.Link.OrientUpright, stroke: "#bdc3c7", font: "bold 10px sans-serif", background: "#1e1e1e" },
                        new go.Binding("text", "text")),
                    $(go.TextBlock, { segmentIndex: -1, segmentOffset: new go.Point(NaN, NaN), segmentOrientation: go.Link.OrientUpright, stroke: "#bdc3c7", font: "bold 10px sans-serif", background: "#1e1e1e" },
                        new go.Binding("text", "toText"))
                );

            myDiagram.model = $(go.GraphLinksModel, {
                copiesArrays: true,
                copiesArrayObjects: true,
                linkFromPortIdProperty: "fromPort",
                linkToPortIdProperty: "toPort",
                nodeDataArray: [{"key": "codigo_penal", "color": "#e74c3c", "items": [{"name": "iucr : VARCHAR(50)", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "codigo_fbi : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "gravedad_delito : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "catalogo_ubicacion", "color": "#e74c3c", "items": [{"name": "id_ubicacion : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "descripcion_lugar : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "es_espacio_publico : BOOLEAN", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "rol_oficial", "color": "#3498db", "items": [{"name": "id_rol : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "nombre_rol : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "descripcion : TEXT", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "oficial_policia", "color": "#3498db", "items": [{"name": "id_oficial : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "placa_policial : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "nombre : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "apellidos : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "correo_electronico : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "telefono_contacto : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "fecha_ingreso : DATE", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "id_rol : INT", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "fotografia : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "chicago_crimes", "color": "#e74c3c", "items": [{"name": "case_number : VARCHAR(255)", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "date : TIMESTAMP", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "block : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "iucr : VARCHAR(50)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "id_ubicacion : INT", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "arrest : BOOLEAN", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "domestic : BOOLEAN", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "beat : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "district : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "ward : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "community_area : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "x_coordinate : DECIMAL(15,2)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "y_coordinate : DECIMAL(15,2)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "year : INT", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "updated_on : TIMESTAMP", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "latitude : DECIMAL(10,6)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "longitude : DECIMAL(10,6)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "incidente_delito", "color": "#e74c3c", "items": [{"name": "id_incidente_delito : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "case_number : VARCHAR(255)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "es_delito_primario : BOOLEAN", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "estado_climatico : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "detonacion_armas : BOOLEAN", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "seguimiento_incidente", "color": "#e74c3c", "items": [{"name": "id_seguimiento : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "case_number : VARCHAR(255)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "fecha_registro : TIMESTAMP", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "estado_caso : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "descripcion_avance : TEXT", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "id_oficial : INT", "iskey": false, "figure": "Link", "color": "#3498db"}]}, {"key": "caso_judicial", "color": "#e74c3c", "items": [{"name": "id_caso_judicial : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "case_number : VARCHAR(255)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "juzgado_asignado : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "fecha_audiencia : DATE", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "veredicto : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "testigo", "color": "#9b59b6", "items": [{"name": "id_testigo : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "case_number : VARCHAR(255)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "nombre : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "identificacion : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "genero : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "telefono : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "direccion : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "testimonio : TEXT", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "es_anonimo : BOOLEAN", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "victima", "color": "#9b59b6", "items": [{"name": "id_victima : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "case_number : VARCHAR(255)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "nombre : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "identificacion : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "genero : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "telefono : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "direccion : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "banda_criminal", "color": "#9b59b6", "items": [{"name": "id_banda : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "nombre_banda : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "zona_operacion : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "nivel_peligrosidad : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "sospechoso", "color": "#9b59b6", "items": [{"name": "id_sospechoso : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "case_number : VARCHAR(255)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "nombre : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "identificacion : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "genero : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "telefono : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "direccion : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "alias_conocido : VARCHAR(255)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "fecha_nacimiento : DATE", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "antecedentes : BOOLEAN", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "observacion : TEXT", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "id_banda : INT", "iskey": false, "figure": "Link", "color": "#3498db"}]}, {"key": "investigacion_especial", "color": "#e74c3c", "items": [{"name": "id_investigacion : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "case_number : VARCHAR(255)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "id_detective : INT", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "prioridad_mayor : INT", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "estado : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "reporte_final : TEXT", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "fecha_asignacion : DATE", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "fecha_resolucion : DATE", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}]}, {"key": "evidencia", "color": "#f39c12", "items": [{"name": "id_evidencia : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "case_number : VARCHAR(255)", "iskey": false, "figure": "Link", "color": "#3498db"}, {"name": "tipo_evidencia : VARCHAR(100)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "fecha_recoleccion : TIMESTAMP", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "id_oficial : INT", "iskey": false, "figure": "Link", "color": "#3498db"}]}, {"key": "vehiculo_patrulla", "color": "#f39c12", "items": [{"name": "id_vehiculo : INT", "iskey": true, "figure": "Key", "color": "#f1c40f"}, {"name": "codigo_flota : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "placa_vehiculo : VARCHAR(50)", "iskey": false, "figure": "Cube1", "color": "#ecf0f1"}, {"name": "tipo_vehiculo : VARCHAR(100)", "iskey": false, "figure": "Cube1", "c
